name: Setup Kotlin
description: Setup Kotlin environment for GitHub Actions

runs:
  using: composite
  steps:
    - name: Setup java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'

    - name: Gradle cache
      uses: actions/cache@v4
      with:
        path: ~/.gradle
        key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*') }}

    - name: Gradle permission
      run: chmod +x gradlew
      shell: bash