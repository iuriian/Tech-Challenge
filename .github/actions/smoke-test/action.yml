name: Smoke Test Docker
description: 'Sobe a imagem com um PostgreSQL descartavel e valida os endpoints do actuator antes do push/deploy'

inputs:
  image-tag:
    description: 'Tag da imagem Docker para testar'
    required: true

  port:
    description: 'Porta no host para publicar a aplicacao (o container sempre escuta em 8080)'
    required: false
    default: '8080'

  timeout:
    description: 'Timeout em segundos para a aplicacao responder /actuator/health'
    required: false
    default: '180'

  with-postgres:
    description: 'Sobe um PostgreSQL descartavel na mesma rede (a aplicacao roda Flyway no boot)'
    required: false
    default: 'true'

  env:
    description: 'Variaveis de ambiente da aplicacao, uma por linha no formato CHAVE=valor'
    required: false
    default: ''

runs:
  using: 'composite'

  steps:
    - name: Validate inputs
      shell: bash
      run: |
        if [ -z "${{ inputs.image-tag }}" ]; then
          echo "❌ image-tag is required"
          exit 1
        fi

    - name: Start PostgreSQL
      if: inputs.with-postgres == 'true'
      shell: bash
      run: |
        set -e
        docker network create smoke-net 2>/dev/null || true

        docker run -d --name smoke-db --network smoke-net \
          -e POSTGRES_DB=oficina \
          -e POSTGRES_USER=user \
          -e POSTGRES_PASSWORD=password \
          postgres:16-alpine

        echo "⏳ Aguardando PostgreSQL..."
        for i in $(seq 1 30); do
          if docker exec smoke-db pg_isready -U user -d oficina >/dev/null 2>&1; then
            echo "✅ PostgreSQL pronto (${i}s)"
            exit 0
          fi
          sleep 1
        done

        echo "❌ PostgreSQL nao ficou pronto"
        docker logs smoke-db
        exit 1

    - name: Start application container
      shell: bash
      env:
        SMOKE_ENV: ${{ inputs.env }}
      run: |
        set -e
        IMAGE="${{ inputs.image-tag }}"
        PORT="${{ inputs.port }}"

        ENV_FILE="$(mktemp)"
        printf '%s\n' "$SMOKE_ENV" | grep -v '^[[:space:]]*$' > "$ENV_FILE" || true

        echo "🚀 Subindo container a partir de: $IMAGE"
        echo "   Variaveis de ambiente:"
        sed 's/\(PASSWORD=\).*/\1***/' "$ENV_FILE" | sed 's/^/     /'

        NETWORK_ARG=""
        if [ "${{ inputs.with-postgres }}" = "true" ]; then
          NETWORK_ARG="--network smoke-net"
        fi

        # A prontidao e verificada do runner (curl do host), e nao por HEALTHCHECK
        # do Docker: a imagem runtime nao garante ter curl instalado.
        docker run -d --name smoke-test $NETWORK_ARG \
          -p "${PORT}:8080" \
          --env-file "$ENV_FILE" \
          "$IMAGE"

        rm -f "$ENV_FILE"

        TIMEOUT="${{ inputs.timeout }}"
        ELAPSED=0
        echo "⏳ Aguardando /actuator/health (max ${TIMEOUT}s)..."

        while [ "$ELAPSED" -lt "$TIMEOUT" ]; do
          if ! docker ps --format '{{.Names}}' | grep -q '^smoke-test$'; then
            echo "❌ O container morreu durante o boot"
            docker logs smoke-test
            exit 1
          fi

          if curl -fsS "http://localhost:${PORT}/actuator/health" >/dev/null 2>&1; then
            echo "✅ Aplicacao respondendo (${ELAPSED}s)"
            exit 0
          fi

          sleep 3
          ELAPSED=$((ELAPSED + 3))
        done

        echo "❌ A aplicacao nao respondeu em ${TIMEOUT}s"
        docker logs smoke-test
        exit 1

    - name: Run smoke tests
      shell: bash
      run: |
        PORT="${{ inputs.port }}"
        FAILED=0

        # Imprime o status HTTP: 404 (endpoint inexistente, erro de configuracao)
        # e 503 (endpoint existe e reporta DOWN) sao problemas bem diferentes, e
        # "curl -f" sozinho esconde a diferenca.
        check() {
          local endpoint="$1" required="$2"
          local code
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
                 "http://localhost:${PORT}${endpoint}" || echo "000")

          if [ "$code" = "200" ]; then
            printf '  %-38s %s ✅\n' "$endpoint" "$code"
          elif [ "$required" = "required" ]; then
            printf '  %-38s %s ❌\n' "$endpoint" "$code"
            FAILED=$((FAILED + 1))
          else
            printf '  %-38s %s ⚠️  (informativo)\n' "$endpoint" "$code"
          fi
        }

        echo "🧪 Smoke tests - o que a imagem precisa servir:"
        check /actuator/health          required
        check /actuator/info            required
        check /v3/api-docs              required
        check /swagger-ui/index.html    required

        # Os grupos liveness/readiness sao uma preocupacao do Kubernetes, e quem
        # os valida de verdade e o kubelet: se nao responderem, o startupProbe
        # falha, o pod nunca fica Ready e o `kubectl rollout status` derruba o
        # deploy. Aqui sao apenas informativos - o ambiente de um container solto
        # nao e o lugar para transformar isso em portao.
        echo ""
        echo "ℹ️  Endpoints de probe (validados pelo Kubernetes, nao bloqueiam aqui):"
        check /actuator/health/liveness  optional
        check /actuator/health/readiness optional

        echo ""
        if [ "$FAILED" -eq 0 ]; then
          echo "✅ Smoke tests obrigatorios passaram"
        else
          echo "❌ $FAILED endpoint(s) obrigatorio(s) falharam"
          docker logs smoke-test
          exit 1
        fi

    - name: Cleanup
      if: always()
      shell: bash
      run: |
        docker rm -f smoke-test smoke-db 2>/dev/null || true
        docker network rm smoke-net 2>/dev/null || true
        echo "🧹 Ambiente de smoke test removido"
