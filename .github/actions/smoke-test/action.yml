name: Smoke Test Docker
description: 'Validar que a imagem Docker sobe e responde antes de fazer push/deploy'

inputs:
  image-tag:
    description: 'Tag da imagem Docker para testar'
    required: true

  port:
    description: 'Porta para testar'
    required: false
    default: '8080'

  timeout:
    description: 'Timeout em segundos para app ficar ready'
    required: false
    default: '180'

runs:
  using: 'composite'

  steps:
    - name: Validate inputs
      shell: bash
      run: |
        if [ -z "${{ inputs.image-tag }}" ]; then
          echo "❌ image-tag is required"
          exit 1
        fi

    - name: Start Docker container
      id: start
      shell: bash
      run: |
        IMAGE="${{ inputs.image-tag }}"
        PORT=${{ inputs.port }}

        echo "🚀 Starting container from image: $IMAGE"
        echo "📌 Port: $PORT"
        echo ""

        # Iniciar container com variáveis de ambiente para Keycloak
        docker run -d --name smoke-test \
          -p $PORT:$PORT \
          -e KEYCLOAK_URL=http://localhost:8081 \
          -e KEYCLOAK_REALM=master \
          -e KEYCLOAK_CLIENT_ID=test \
          -e KEYCLOAK_CLIENT_SECRET=test \
          -e DATABASE_URL=jdbc:postgresql://localhost:5432/test \
          -e DATABASE_USER=test \
          -e DATABASE_PASSWORD=test \
          "$IMAGE"

        if [ $? -ne 0 ]; then
          echo "❌ Failed to start container"
          exit 1
        fi

        CONTAINER_ID=$(docker ps -aq -f name=smoke-test)
        echo "✅ Container started (ID: $CONTAINER_ID)"
        echo ""

    - name: Wait for container to be running
      shell: bash
      run: |
        echo "⏳ Waiting for container to start..."

        for i in {1..30}; do
          if docker ps | grep -q smoke-test; then
            echo "✅ Container is running"
            sleep 3
            exit 0
          fi
          echo "  [$i/30] Still waiting..."
          sleep 1
        done

        echo "❌ Container failed to start"
        docker logs smoke-test --tail=20
        exit 1

    - name: Wait for port to respond
      shell: bash
      run: |
        PORT=${{ inputs.port }}
        TIMEOUT=${{ inputs.timeout }}
        ELAPSED=0

        echo "⏳ Waiting for port $PORT to respond (max ${TIMEOUT}s)..."
        echo ""

        while [ $ELAPSED -lt $TIMEOUT ]; do
          if nc -z localhost $PORT 2>/dev/null; then
            echo "✅ Port $PORT is responding (${ELAPSED}s)"
            echo ""
            exit 0
          fi

          if [ $((ELAPSED % 10)) -eq 0 ]; then
            echo "  [$ELAPSED/$TIMEOUT] Waiting for port..."
          fi

          sleep 1
          ELAPSED=$((ELAPSED + 1))
        done

        echo "❌ Port $PORT not responding after ${TIMEOUT}s"
        echo ""
        echo "📜 Container logs:"
        docker logs smoke-test --tail=50
        exit 1

    - name: Test health endpoints
      shell: bash
      run: |
        PORT=${{ inputs.port }}
        echo "🧪 Running health checks..."
        echo ""

        SUCCESS=0
        TIMEOUT=10

        # Test 1: Health
        echo -n "  [1/4] GET /actuator/health ... "
        HTTP_CODE=$(curl -s -m $TIMEOUT -w "%{http_code}" -o /tmp/health.json http://localhost:$PORT/actuator/health 2>/dev/null || echo "000")

        if [ "$HTTP_CODE" != "000" ]; then
          echo "✅ (HTTP $HTTP_CODE)"
          SUCCESS=$((SUCCESS + 1))
          if [ -f /tmp/health.json ]; then
            BODY=$(cat /tmp/health.json)
            echo "     Response: $BODY"
          fi
        else
          echo "⚠️ (Timeout or error)"
        fi

        # Test 2: Liveness
        echo -n "  [2/4] GET /actuator/health/liveness ... "
        HTTP_CODE=$(curl -s -m $TIMEOUT -w "%{http_code}" -o /dev/null http://localhost:$PORT/actuator/health/liveness 2>/dev/null || echo "000")

        if [ "$HTTP_CODE" != "000" ]; then
          echo "✅ (HTTP $HTTP_CODE)"
          SUCCESS=$((SUCCESS + 1))
        else
          echo "⚠️ (Timeout or error)"
        fi

        # Test 3: Readiness
        echo -n "  [3/4] GET /actuator/health/readiness ... "
        HTTP_CODE=$(curl -s -m $TIMEOUT -w "%{http_code}" -o /dev/null http://localhost:$PORT/actuator/health/readiness 2>/dev/null || echo "000")

        if [ "$HTTP_CODE" != "000" ]; then
          echo "✅ (HTTP $HTTP_CODE)"
          SUCCESS=$((SUCCESS + 1))
        else
          echo "⚠️ (Timeout or error)"
        fi

        # Test 4: Basic connectivity
        echo -n "  [4/4] Basic connectivity test ... "
        if timeout 5 bash -c "echo > /dev/tcp/localhost/$PORT" 2>/dev/null; then
          echo "✅"
          SUCCESS=$((SUCCESS + 1))
        else
          echo "❌"
        fi

        echo ""
        echo "✅ Tests completed: $SUCCESS/4 passed"
        echo ""
        echo "✨ Smoke test successful! Container is responding."
        exit 0

    - name: Show container logs
      if: always()
      shell: bash
      run: |
        echo "📜 Container logs (last 40 lines):"
        echo ""
        docker logs smoke-test --tail=40 2>/dev/null || echo "Could not get logs"

    - name: Show container info
      if: always()
      shell: bash
      run: |
        echo ""
        echo "📋 Container status:"
        docker inspect smoke-test --format='
        State: {{.State.Status}}
        PID: {{.State.Pid}}
        Exit Code: {{.State.ExitCode}}
        ' 2>/dev/null || echo "Container not found"

    - name: Stop Docker container
      if: always()
      shell: bash
      run: |
        if docker ps -a | grep -q smoke-test; then
          echo "🛑 Stopping container..."
          docker stop smoke-test 2>/dev/null || true
          docker rm smoke-test 2>/dev/null || true
          echo "✅ Container stopped"
        fi