name: CI

on:
  pull_request:
    branches: [develop]

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Kotlin
        uses: ./.github/actions/setup-kotlin

      - name: Spotless
        with:
            github-token: ${{ secrets.GITHUB_TOKEN }}
        uses: ./.github/actions/spotless

      - name: Detekt
        with:
            github-token: ${{ secrets.GITHUB_TOKEN }}
            max-issues: ${{ inputs.max-issues }}
        uses: ./.github/actions/detekt

  unit_test:
    name: Unit Test
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read
      pull-requests: write
      checks: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Kotlin
        uses: ./.github/actions/setup-kotlin

      - name: Run Tests
        run: ./gradlew test --continue

      - name: Coverage Report
        if: always()
        run: ./gradlew jacocoTestReport

      - name: Publish test results
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          check-name: "Test Report"
          report_paths: '**/build/test-results/test/TEST-*.xml'
          detailed_summary: true
          include_passed: false

      - name: Show coverage report
        if: always() && github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@v1.7.1
        with:
          paths: ${{ github.workspace }}/build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 0
          min-coverage-changed-files: 85
          title: Cobertura de testes
          update-comment: false
          comment-type: both
          show-all-modules: true
          show-missing-lines: true
          coverage-counter-type: BRANCH

      - name: Verify minimum coverage
        run: ./gradlew jacocoTestCoverageVerification

      - name: Upload Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ github.job }}
          path: '**/build/reports/jacoco/test/'
          if-no-files-found: warn
          retention-days: 7

