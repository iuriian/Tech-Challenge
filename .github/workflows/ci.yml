name: CI

on:
  pull_request:
    branches: [develop]

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Kotlin
        uses: ./.github/actions/setup-kotlin

      - name: Spotless
        with:
            github-token: ${{ secrets.GITHUB_TOKEN }}
        uses: ./.github/actions/spotless

      - name: Detekt
        with:
            github-token: ${{ secrets.GITHUB_TOKEN }}
            max-issues: ${{ inputs.max-issues }}
        uses: ./.github/actions/detekt

  unit_test:
    name: Unit Test
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Kotlin
        uses: ./.github/actions/setup-kotlin

      - name: Run Tests
        run: ./gradlew test

      - name: Coverage Report
        if: always()
        run: ./gradlew jacocoTestReport

      - name: Show coverage report
        if: github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@v1.7.1
        with:
          paths: ${{ github.workspace }}/build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          minimum-coverage: 80
          minimum-coverage-changed-files: 80
          title: Cobertura de testes
          update-comment: true

      - name: Upload Reports
        uses: ./.github/actions/upload-reports

      - name: Verify minimum coverage
        run: ./gradlew jacocoTestCoverageVerification

  build:
    name: Build
    needs: unit_test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Kotlin
        uses: ./.github/actions/setup-kotlin

      - name: Run build
        run: ./gradlew build
