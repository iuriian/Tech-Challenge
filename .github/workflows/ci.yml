name: CI

on:
  pull_request:
    branches: [develop]

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Kotlin
        uses: ./.github/actions/setup-kotlin

      - name: Spotless Check
        run: ./gradlew spotlessCheck

      - name: Detekt
        run: ./gradlew detekt

  unit_test:
    name: Unit Test
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Kotlin
        uses: ./.github/actions/setup-kotlin

      - name: Run Tests
        run: ./gradlew test jacocoTestReport

      - name: Upload Reports
        uses: ./.github/actions/upload-reports

  build:
    name: Build
    needs: unit_test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Kotlin
        uses: ./.github/actions/setup-kotlin

      - name: Run build
        run: ./gradlew build
