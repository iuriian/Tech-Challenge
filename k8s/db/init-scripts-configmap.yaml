apiVersion: v1
kind: ConfigMap
metadata:
  name: db-init-scripts
data:
  init.sql: |
    -- Executado apenas na primeira inicializacao do cluster Postgres.
    -- O banco POSTGRES_DB (oficina) ja e criado automaticamente.
    SELECT 'CREATE DATABASE keycloak'
      WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'keycloak')\gexec

    SELECT 'CREATE DATABASE sonarqube'
      WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'sonarqube')\gexec
