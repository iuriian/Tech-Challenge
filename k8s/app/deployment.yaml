apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels: { app: app }
spec:
  replicas: 1
  selector:
    matchLabels: { app: app }
  template:
    metadata:
      labels: { app: app }
    spec:
      imagePullSecrets:
        - name: ghcr-creds
      initContainers:
        - name: wait-for-db
          image: postgres:16-alpine
          command: ["sh", "-c", "until pg_isready -h db -U user; do sleep 2; done"]
      containers:
        - name: app
          image: ghcr.io/iuriian/tech-challenge:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef: { name: app-config }
          env:
            - name: DB_USERNAME
              valueFrom: { secretKeyRef: { name: db-credentials, key: POSTGRES_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: db-credentials, key: POSTGRES_PASSWORD } }
          startupProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 5
