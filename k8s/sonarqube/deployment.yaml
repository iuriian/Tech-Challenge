apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarqube
  labels: { app: sonarqube }
spec:
  replicas: 1
  selector:
    matchLabels: { app: sonarqube }
  template:
    metadata:
      labels: { app: sonarqube }
    spec:
      initContainers:
        - name: wait-for-db
          image: postgres:16-alpine
          command: ["sh", "-c", "until pg_isready -h db -U user; do sleep 2; done"]
      containers:
        - name: sonarqube
          image: sonarqube:lts-community
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9000
          envFrom:
            - configMapRef: { name: sonarqube-config }
          env:
            - name: SONAR_JDBC_USERNAME
              valueFrom: { secretKeyRef: { name: db-credentials, key: POSTGRES_USER } }
            - name: SONAR_JDBC_PASSWORD
              valueFrom: { secretKeyRef: { name: db-credentials, key: POSTGRES_PASSWORD } }
          volumeMounts:
            - { name: data, mountPath: /opt/sonarqube/data }
            - { name: extensions, mountPath: /opt/sonarqube/extensions }
            - { name: logs, mountPath: /opt/sonarqube/logs }
          startupProbe:
            httpGet: { path: /api/system/status, port: 9000 }
            failureThreshold: 30   # ~5min de tolerância pro boot lento do SonarQube
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /api/system/status, port: 9000 }
            periodSeconds: 15
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: sonarqube-data } }
        - { name: extensions, persistentVolumeClaim: { claimName: sonarqube-extensions } }
        - { name: logs, persistentVolumeClaim: { claimName: sonarqube-logs } }