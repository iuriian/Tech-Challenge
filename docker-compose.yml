services:
  db:
    image: postgres:16-alpine
    container_name: oficina-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-oficina}
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./conf/init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-oficina}"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.2.1
    container_name: oficina-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME: ${KEYCLOAK_URL:-http://localhost:8081}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_RELATIVE_PATH: /
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-user}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "8081:8080"
    volumes:
      - ./conf/realm-export.json:/opt/keycloak/data/import/realm.json:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  app:
    profiles: ["full"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oficina-app
    ports:
      - "8090:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-oficina}
      DB_USERNAME: ${POSTGRES_USER:-user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-password}
      KEYCLOAK_URL: ${KEYCLOAK_URL:-http://localhost:8081}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-Fiap}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-oficina}
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/${KEYCLOAK_REALM:-Fiap}/protocol/openid-connect/certs
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  nginx:
    profiles: ["full"]
    image: nginx:alpine
    container_name: postech-nginx
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "80:80"
    volumes:
      - ./conf/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      keycloak:
        condition: service_healthy
      app:
        condition: service_started

networks:
  default:
    driver: bridge

volumes:
  postgres_data: