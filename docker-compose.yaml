services:
  db:
    image: postgres:16-alpine
    container_name: oficina-db
    environment:
      POSTGRES_DB: oficina
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./conf/init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d oficina"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.2.1
    container_name: keycloak-oficina
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
#      KC_HOSTNAME: sso.postech.com.br
      KC_HOSTNAME: localhost
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: user
      KC_DB_PASSWORD: password

    ports:
      - "8081:8080"
    volumes:
      - ./conf/realm-export.json:/opt/keycloak/data/import/realm.json:ro
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: postech-nginx
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "80:80"
    volumes:
      - ./conf/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - keycloak
      - app

  sonarqube:
    image: sonarqube:lts-community
    container_name: sonarqube-oficina
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/sonarqube
      SONAR_JDBC_USERNAME: user
      SONAR_JDBC_PASSWORD: password
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
      SONAR_SEARCH_JAVAADDITIONALOPTS: "-Dnode.store.allow_mmap=false"
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"'"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oficina-app
    ports:
      - "8080:8080"
    environment:
      # Banco na rede interna do compose
      DB_URL: jdbc:postgresql://db:5432/oficina
      DB_USERNAME: user
      DB_PASSWORD: password
      # Issuer publico: precisa casar com o "iss" do token emitido para o navegador
      # (o Swagger autentica o usuario contra http://localhost:8081).
      KEYCLOAK_URL: http://localhost:8081
      KEYCLOAK_REALM: Fiap
      KEYCLOAK_CLIENT_ID: oficina
      # JWKS buscado pelo app dentro da rede do compose (nao use localhost aqui).
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/Fiap/protocol/openid-connect/certs
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    driver: bridge

volumes:
  postgres_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs: