# ============================================================
# Perfil "test" - usado pelos testes de integração.
# O datasource é fornecido em tempo de execução pelo container
# PostgreSQL do Testcontainers (@ServiceConnection); apenas o
# schema/seed (Flyway) e a segurança são configurados aqui.
# ============================================================

spring.application.name=oficina-mecanica-test

# Flyway continua dono do schema (migrations + seed em db/migration).
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Hibernate apenas valida/usa o schema criado pelo Flyway; nada de DDL.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Valores fictícios de Keycloak. Os testes autenticam via @WithMockUser,
# portanto o JwtDecoder nunca é acionado; o jwk-set-uri evita qualquer
# tentativa de download de chaves na subida do contexto.
KEYCLOAK_URL=http://localhost:9999
KEYCLOAK_REALM=test
KEYCLOAK_CLIENT_ID=oficina-test
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9999/realms/test/protocol/openid-connect/certs
