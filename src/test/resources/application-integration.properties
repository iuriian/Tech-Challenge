# H2 in-memory database — Flyway desabilitado, schema criado pelo Hibernate
spring.datasource.url=jdbc:h2:mem:oficina_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
spring.jpa.show-sql=false

# Resolve os placeholders de ${KEYCLOAK_URL} e ${KEYCLOAK_REALM} definidos em application.properties
# sem precisar do arquivo .env — o JwtDecoder é mockado, então a URL nunca é acessada
KEYCLOAK_URL=http://localhost:9999
KEYCLOAK_REALM=test
KEYCLOAK_CLIENT_ID=test
