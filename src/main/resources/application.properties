spring.application.name=oficina-mecanica

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/oficina}
spring.datasource.username=${DB_USERNAME:user}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

#spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

springdoc.swagger-ui.operationsSorter=(a,b)=>{const order={post:1,put:2,patch:3,delete:4,get:5};return (order[a.get("method")]||99)-(order[b.get("method")]||99);}

spring.config.import=optional:file:.env[.properties]

# Keycloak OAuth2 Resource Server
# issuer-uri: valida o claim "iss" do token (deve casar com a URL pela qual o usuario autenticou).
# jwk-set-uri: endereco das chaves publicas, buscado pelo servidor. Em container, aponte para a rede
# interna do compose via KEYCLOAK_JWK_SET_URI (http://keycloak:8080), mantendo o issuer publico.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_URL}/realms/${KEYCLOAK_REALM}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:${KEYCLOAK_URL}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs}

# Springdoc / Swagger UI
springdoc.swagger-ui.oauth.client-id=${KEYCLOAK_CLIENT_ID:oficina}
springdoc.swagger-ui.oauth.client-secret=
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha