kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: oficina-local
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080   # nginx
        hostPort: 80
      - containerPort: 30081   # keycloak
        hostPort: 8081
      - containerPort: 30090   # sonarqube
        hostPort: 9000
      - containerPort: 30083
        hostPort: 8080